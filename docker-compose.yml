services:
  backend:
    build:
      context: ./backend
    container_name: bpms-backend
    ports:
      - "5000:5000"
    # All secrets (DATABASE_URL, SUPABASE_URL, ...) come from the root .env file
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    volumes:
      # Persist multer uploads and temp files across restarts
      - uploads_data:/app/uploads
      - tmp_data:/app/tmp
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Browser-facing URL of the backend (must be reachable from the host)
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    container_name: bpms-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  uploads_data:
  tmp_data:
